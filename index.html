<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SplatCam</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font: 13px ui-monospace, Menlo, monospace; color: #ddd; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud { position: fixed; top: 8px; left: 8px; padding: 4px 8px; background: #0008; border-radius: 4px; pointer-events: none; }
    #panel { position: fixed; top: 8px; right: 8px; width: 260px; max-width: calc(100vw - 16px); box-sizing: border-box; padding: 10px; background: #000b; border-radius: 6px; display: grid; gap: 8px; max-height: calc(100vh - 16px); overflow-y: auto; }
    #panel .sep { color: #79c; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin-top: 4px; border-top: 1px solid #333; padding-top: 8px; }
    #panel .val { color: #ddd; font-weight: normal; }
    #panel .row { display: flex; gap: 6px; }
    #panel button { flex: 1; padding: 8px; min-height: 36px; background: #2228; color: #ddd; border: 1px solid #555; border-radius: 4px; font: inherit; }
    #panel button.on { background: #357; border-color: #79c; color: #fff; }
    #panel .field { display: grid; gap: 4px; }
    #panel .field span { color: #999; font-size: 11px; }
    #panel select, #panel input[type=number] { width: 100%; box-sizing: border-box; padding: 6px; min-height: 32px; background: #222; color: #ddd; border: 1px solid #555; border-radius: 4px; font: inherit; }
    #panel input[type=range] { width: 100%; }
    #panel .readout { white-space: pre; color: #9c9; font-size: 12px; }
    #panel.exploring .field, #panel.exploring .readout { opacity: .45; }
    #timeline { position: fixed; left: 8px; right: 284px; bottom: 8px; box-sizing: border-box; padding: 8px; background: #000b; border-radius: 6px; display: grid; gap: 6px; }
    #timeline.hidden { display: none; }
    #timeline .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    #timeline button { padding: 4px 10px; min-height: 30px; background: #2228; color: #ddd; border: 1px solid #555; border-radius: 4px; font: inherit; }
    #timeline button.on { background: #357; border-color: #79c; color: #fff; }
    #timeline button.rec { background: #8b1a1a; border-color: #f66; color: #fff; }
    #timeline input[type=number] { width: 60px; padding: 4px; background: #222; color: #ddd; border: 1px solid #555; border-radius: 4px; font: inherit; }
    #timeline .time { color: #9c9; min-width: 60px; }
    #timeline canvas { width: 100%; height: 230px; touch-action: none; border-radius: 4px; }
    #timeline.collapsed canvas { display: none; }
    @media (max-width: 760px) { #timeline { right: 8px; bottom: 8px; } }
    #export .open { position: fixed; top: 40px; left: 8px; padding: 4px 10px; min-height: 30px; background: #000b; color: #ddd; border: 1px solid #555; border-radius: 4px; font: inherit; }
    #export .box { position: fixed; inset: 0; background: #000a; display: grid; place-items: center; z-index: 10; }
    #export .box.hidden { display: none; }
    #export .card { width: 340px; max-width: calc(100vw - 32px); box-sizing: border-box; padding: 14px; background: #181818; border: 1px solid #444; border-radius: 8px; display: grid; gap: 8px; }
    #export h3 { margin: 0; font-size: 14px; }
    #export .field { display: grid; gap: 4px; }
    #export .field span, #export .status { color: #999; font-size: 11px; }
    #export .status.err { color: #f88; }
    #export .check { color: #999; font-size: 11px; }
    #export .readout { white-space: pre; color: #9c9; font-size: 12px; }
    #export select, #export input[type=number] { width: 100%; box-sizing: border-box; padding: 6px; min-height: 32px; background: #222; color: #ddd; border: 1px solid #555; border-radius: 4px; font: inherit; }
    #export progress { width: 100%; }
    #export .row { display: flex; gap: 6px; }
    #export .row button { flex: 1; padding: 8px; min-height: 36px; background: #2228; color: #ddd; border: 1px solid #555; border-radius: 4px; font: inherit; }
    #export .row button.go { background: #357; border-color: #79c; color: #fff; }
    #export button:disabled { opacity: .4; }
    #hint { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; font-size: 16px; color: #888; text-align: center; }
  </style>
</head>
<body>
  <canvas id="app"></canvas>
  <div id="hud">…</div>
  <div id="panel"></div>
  <div id="timeline"></div>
  <div id="export"></div>
  <div id="hint">Glisse un fichier .ply / .sog / .splat / .spz ici</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
