<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>SplatCam télécommande</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #111; color: #ddd; font: 15px ui-monospace, Menlo, monospace; -webkit-text-size-adjust: 100%; }
    body { padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
    h1 { margin: 0; font-size: 15px; font-weight: normal; display: flex; align-items: center; gap: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #a33; }
    .dot.on { background: #4c6; }
    section { display: grid; gap: 10px; padding: 12px; background: #1a1a1a; border-radius: 8px; }
    section > .title { color: #79c; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
    .row { display: flex; gap: 8px; }
    button { flex: 1; min-height: 48px; padding: 8px; background: #262626; color: #ddd; border: 1px solid #555; border-radius: 8px; font: inherit; touch-action: manipulation; }
    button:active { background: #357; }
    button.on { background: #357; border-color: #79c; color: #fff; }
    button.rec.on { background: #8b1a1a; border-color: #f66; }
    button.big { min-height: 64px; font-size: 20px; }
    input[type=range] { width: 100%; height: 40px; }
    .read { display: flex; justify-content: space-between; align-items: baseline; color: #9c9; }
    .read b { font-size: 22px; color: #fff; font-weight: normal; }
    .offline { opacity: .4; pointer-events: none; }
    #msg { color: #f88; font-size: 12px; min-height: 1em; }
  </style>
</head>
<body>
  <h1><span class="dot" id="dot"></span><span id="status">Connexion…</span></h1>
  <div id="app" class="offline"></div>
  <div id="msg"></div>
  <script type="module" src="/src/remote/page.ts"></script>
</body>
</html>
